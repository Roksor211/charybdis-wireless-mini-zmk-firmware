draw_config:
  key_w: 72
  key_h: 72
  dark_mode: false
  n_columns: 1
  separate_combo_diagrams: true
  combo_diagrams_scale: 2
  outer_pad_w: 30
  outer_pad_h: 60
  inner_pad_w: 3
  inner_pad_h: 3
  small_pad: 5
  shrink_wide_legends: 0
  footer_text: "DE (PC) | Mitte: Tippen | unten: Halten | oben: Shift | 2x: Doppeltippen | NUM: F-Tasten mit linker Shift"
  svg_extra_style: |
    svg.keymap { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 17px; background: white; fill: #172033; }
    rect.key { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    text.tap { font-weight: 600; }
    text.action.tap { font-size: 12px; }
    text.hold { font-size: 12px; fill: #0369a1; }
    text.shifted { font-size: 12px; fill: #7c3aed; }
    text.tr { font-size: 10px; fill: #a16207; }
    text.label { font-size: 20px; stroke-width: 0; }
    text.footer { font-size: 11px; stroke-width: 0; }
    text.trans { fill: #94a3b8; font-weight: 400; }
    rect.held { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    rect.combo-separate { fill: none; stroke: none; }
    text.combo-separate.tap { font-size: 16px; text-anchor: start; fill: #065f46; }
    text.combo-separate.hold { font-size: 11px; text-anchor: start; fill: #64748b; }
    rect.layer { fill: #eff6ff; stroke: #93c5fd; }
    rect.dead { fill: #fff7ed; stroke: #fdba74; }

parse_config:
  preprocess: true
  zmk_preamble: "#define KEYMAP_DRAWER"
  trans_legend: {t: "▽", type: trans}
  modifier_fn_map:
    left_ctrl: Strg
    right_ctrl: Strg
    left_shift: Shift
    right_shift: Shift
    left_alt: Alt
    right_alt: AltGr
    left_gui: Win
    right_gui: Win
    keycode_combiner: "{mods}+{key}"
    mod_combiner: "{mod_1}+{mod_2}"

  # USB-Keycodes, interpretiert mit dem normalen deutschen PC-Layout.
  zmk_keycode_map:
    Y: "Z"
    Z: "Y"
    N0: {t: "0", s: "="}
    N1: {t: "1", s: "!"}
    N2: {t: "2", s: '"'}
    N3: {t: "3", s: "§"}
    N4: {t: "4", s: "$"}
    N5: {t: "5", s: "%"}
    N6: {t: "6", s: "&"}
    N7: {t: "7", s: "/"}
    N8: {t: "8", s: "("}
    N9: {t: "9", s: ")"}
    APOS: {t: "ä", s: "Ä"}
    SEMICOLON: {t: "ö", s: "Ö"}
    LBKT: {t: "ü", s: "Ü"}
    RBKT: {t: "+", s: "*"}
    MINUS: {t: "ß", s: "?"}
    EQUAL: {t: "´", s: "`", type: dead}
    GRAVE: {t: "^", s: "°", type: dead}
    BSLH: {t: "#", s: "'"}
    NON_US_BSLH: {t: "<", s: ">"}
    COMMA: {t: ",", s: ";"}
    PERIOD: {t: ".", s: ":"}
    DOT: {t: ".", s: ":"}
    FSLH: {t: "-", s: "_"}
    "LS(N0)": "="
    "LS(N1)": "!"
    "LS(N2)": '"'
    "LS(N3)": "§"
    "LS(N4)": "$"
    "LS(N5)": "%"
    "LS(N6)": "&"
    "LS(N7)": "/"
    "LS(N8)": "("
    "LS(N9)": ")"
    "LS(COMMA)": ";"
    "LS(PERIOD)": ":"
    "LS(MINUS)": "?"
    "LS(RBKT)": "*"
    "LS(EQUAL)": {t: "`", type: dead}
    "LS(FSLH)": "_"
    "LS(NON_US_BSLH)": ">"
    "RA(Q)": "@"
    "RA(N7)": "{"
    "RA(N8)": "["
    "RA(N9)": "]"
    "RA(N0)": "}"
    "RA(RBKT)": "~"
    "RA(MINUS)": "\\"
    "RA(NON_US_BSLH)": "|"
    LCTRL: Strg
    RCTRL: Strg
    LSHFT: Shift
    RSHFT: Shift
    LSHIFT: Shift
    RSHIFT: Shift
    LEFT_SHIFT: Shift
    RIGHT_SHIFT: Shift
    LEFT_ALT: Alt
    LALT: Alt
    RALT: AltGr
    LCMD: Win
    RCMD: Win
    LGUI: Win
    RGUI: Win
    BACKSPACE: "⌫"
    DEL: Entf
    TAB: Tab
    ENTER: Enter
    SPACE: Leer
    ESC: Esc
    LEFT_ARROW: "←"
    RIGHT_ARROW: "→"
    UP: "↑"
