## PMW3610 Driver
## https://github.com/badjeff/zmk-pmw3610-driver
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048
# The local wrapper compiles the driver instead.
CONFIG_INPUT_PMW3610=n

# Windows workaround for Bluetooth battery notifications
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Diagnostic test: host BLE connection without peripheral latency
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0


# `PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS` is not available in the current driver/Kconfig.
# If startup timing issues return, re-check the driver's supported PMW3610 options first.

## --- generic logging ---
# CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_LOG_MODE_DEFERRED=n
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_LOG_BACKEND_UART=y
# CONFIG_USB_CDC_ACM=y
# CONFIG_LOG_MODE_DEFERRED=n

# Temporary USB logging with reduced output
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Bluetooth resources for split discovery during mouse traffic
CONFIG_BT_ATT_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Process Bluetooth TX completions independently of the system workqueue
CONFIG_BT_CONN_TX_NOTIFY_WQ=y

CONFIG_PRINTK=y