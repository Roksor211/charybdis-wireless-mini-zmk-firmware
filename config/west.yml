manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

    - name: 280Zo
      url-base: https://github.com/280Zo

  projects:
    - name: zmk
      remote: zmkfirmware
      # Pin ZMK to a known-good revision from 2026-01-07 to avoid runtime regressions
      # from rebuilding against whatever `main` happens to contain on a given day.
      revision: 70ab6b2
      import: app/west.yml

  self:
    path: config
